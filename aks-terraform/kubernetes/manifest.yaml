apiVersion: v1
kind: Namespace
metadata:
  name: svksounds
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svksounds
  namespace: svksounds
  labels:
    app.kubernetes.io/name: svksounds
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: svksounds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: svksounds
    spec:
      nodeSelector:
        kubernetes.azure.com/agentpool: user
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: svksounds
          image: azurecontainerregistrysvk.azurecr.io/webapp:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9898
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: svksounds
  namespace: svksounds
  labels:
    app.kubernetes.io/name: svksounds
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: svksounds
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP