name: VM Terraform

on:
  push:
    branches: [main]
    paths:
      - "VM-terraform/**"
      - ".github/workflows/vm-terraform.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the Terraform changes"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  TF_VAR_admin_username: ${{ secrets.TF_VAR_ADMIN_USERNAME }}
  TF_VAR_admin_password: ${{ secrets.TF_VAR_ADMIN_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./VM-terraform

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_LAB_SECRET }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        run: terraform apply -input=false -auto-approve tfplan