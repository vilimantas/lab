name: AKS Terraform

on:
  push:
    branches: [main]
    paths:
      - "aks-terraform/**"
      - ".github/workflows/aks-terraform.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the Terraform changes"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./aks-terraform

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_LAB_SECRET }}

      - name: Configure Terraform Azure auth
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_LAB_SECRET }}
        run: |
          echo "ARM_CLIENT_ID=$(jq -r .clientId <<< "$AZURE_CREDENTIALS")" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$(jq -r .clientSecret <<< "$AZURE_CREDENTIALS")" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$(jq -r .tenantId <<< "$AZURE_CREDENTIALS")" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$(jq -r .subscriptionId <<< "$AZURE_CREDENTIALS")" >> "$GITHUB_ENV"
          echo "ARM_USE_AZUREAD=true" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        run: terraform apply -input=false -auto-approve tfplan
